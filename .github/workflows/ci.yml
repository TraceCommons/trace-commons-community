name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check
      # CI builds against the checked-in dummy snapshot by default.
      # Deploy pipelines override TC_API_BASE to fetch live snapshots.
      - run: npm run build
        env:
          TC_USE_DUMMY: "1"
      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  docs:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      # The ROOT deps are needed even though this job only checks docs-site.
      # docs-site/tsconfig.json extends astro/tsconfigs/strict, and the
      # resolver walks up and also finds the repo-root tsconfig.json, whose own
      # `extends` resolves against the ROOT node_modules. Without them,
      # `astro check` fails with "Tsconfig not found astro/tsconfigs/strict" --
      # a message that names docs-site's own extends and sends you looking in
      # the wrong file entirely. Adding include/exclude to docs-site's tsconfig
      # does NOT stop the upward walk; this was verified both ways from a clean
      # clone.
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm run verify
      - name: Upload docs site
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: docs-site/dist/
          retention-days: 7
